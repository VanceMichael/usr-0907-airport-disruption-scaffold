services:
  scaffold:
    build:
      context: .
      dockerfile: Dockerfile.scaffold
    init: true
    healthcheck:
      test: ["CMD", "sh", "scaffold/validate_inputs.sh"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  disruption-service:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${DISRUPTION_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DISRUPTION_DB_PATH: /data/disruptions.db
      FIXTURES_DIR: /srv/app/fixtures
    volumes:
      - disruption-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  disruption-data:
